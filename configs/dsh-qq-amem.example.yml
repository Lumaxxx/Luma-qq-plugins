# 外挂示例（复制为 <QQ_HOME>/home/profiles/web/node_modules/dsh-qq-amem/cordis.patch.yml）
# 需要替换：<BOT_DATA>、<GROUP_ID>、<NAPCAT_HTTP_TOKEN>、<PYTHON>、<SCRIPT_DIR>
- insert:
    - id: qq-amem
      name: 'dsh-qq-amem'
      config:
        enabled: true
        dataDir: '<BOT_DATA>'
        character: dafeiyu
        memory:
          enabled: true
          scanMinutes: 30
          minNewMessages: 25
          maxEvents: 3
          maxTokens: 400
          provider: deepseek-account
          model: deepseek-flash
        proactive:
          enabled: true
          groups: ['<GROUP_ID>']
          quietMinutes: 90
          maxPerDay: 2
          activeHours: [9, 23]
          apiBase: 'http://127.0.0.1:6098'
          apiToken: '<NAPCAT_HTTP_TOKEN>'
          maxChars: 120
          provider: deepseek-account
          model: deepseek-flash
        learn:
          enabled: true
          hour: 3
          minute: 30
          python: '<PYTHON>'
          script: '<SCRIPT_DIR>\ayu-learn.py'
